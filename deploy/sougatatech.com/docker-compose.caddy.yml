services:
  caddy:
    image: caddy:2-alpine
    container_name: sentinelvault-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./app/build/web:/srv/sentinelvault-web:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sentinelvault-net-prod

networks:
  sentinelvault-net-prod:
    external: true

volumes:
  caddy_data:
  caddy_config:
