name: SentinelVault CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ── FLUTTER FRONTEND & CORE JOB ──────────────────────────────────────────
  flutter-test:
    name: Flutter Core and App Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v


      # ── Rust native crypto core (needed by dart:ffi tests) ─────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 target is also needed for wasm-pack build below
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/crypto_core -> target
          # Include wasm-pack binary in the cache key so a version bump
          # forces a fresh install.
          cache-targets: "true"
          key: flutter-test-${{ hashFiles('native/crypto_core/Cargo.lock') }}

      - name: Build native libcrypto_core (host — for dart:ffi tests)
        run: cargo build --release
        working-directory: native/crypto_core
        # Produces: native/crypto_core/target/release/libcrypto_core.so
        # _loadLibrary() in native_crypto_bridge_io.dart probes
        #   <cwd>/../native/crypto_core/target/release/libcrypto_core.so
        # where <cwd> is the `core/` directory used by `flutter test`.

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack &>/dev/null; then
            cargo install wasm-pack --locked
          fi

      - name: Build WASM crypto bundle (for flutter build web)
        run: bash native/build_wasm.sh
        # Produces: app/web/pkg/crypto_core.js + app/web/pkg/crypto_core_bg.wasm

      # Analyze & Test Core Package
      - name: Core — Install Dependencies
        run: flutter pub get
        working-directory: core

      - name: Core — Static Analysis
        run: flutter analyze
        working-directory: core

      - name: Core — Run Tests
        run: flutter test
        working-directory: core

      # Analyze & Test App Package
      - name: App — Install Dependencies
        run: flutter pub get
        working-directory: app

      - name: App — Static Analysis
        run: flutter analyze
        working-directory: app

      - name: App — Run Tests
        run: flutter test --exclude-tags=e2e
        working-directory: app

      - name: Install OSV-Scanner
        run: |
          # Pinned to v2.4.0 (2026-06-18) — update this tag when upgrading.
          # -f makes curl exit non-zero on HTTP errors (4xx/5xx) instead of
          # silently saving an error page as if it were the binary.
          OSV_VERSION="v2.4.0"
          OSV_URL="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
          SHA_URL="https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_SHA256SUMS"

          curl -fsSL -o osv-scanner "${OSV_URL}"
          curl -fsSL -o osv-scanner_SHA256SUMS "${SHA_URL}"

          # Verify SHA-256 checksum against the published sums file.
          grep "osv-scanner_linux_amd64" osv-scanner_SHA256SUMS | sha256sum --check --status || \
            { echo "ERROR: SHA-256 checksum mismatch — aborting install" >&2; exit 1; }

          # Sanity-check: confirm the downloaded file is actually an ELF binary,
          # not an HTML/JSON error page saved silently by a redirected curl.
          file osv-scanner | grep -q ELF || \
            { echo "ERROR: Downloaded file is not a valid ELF binary — download likely failed" >&2; exit 1; }

          chmod +x osv-scanner
          echo "$PWD" >> $GITHUB_PATH

      - name: SCA — Scan Dart Dependencies
        run: osv-scanner -r .
        continue-on-error: true


  # ── NODE.js BACKEND SERVICES JOB ──────────────────────────────────────────
  backend-test:
    name: Node.js Backend Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, security-analysis-service, sync-api]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sentinelvault
          POSTGRES_USER: sentinel_admin
          POSTGRES_PASSWORD: sentinel_password_change_me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_admin -d sentinelvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel_admin:sentinel_password_change_me@localhost:5432/sentinelvault
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: super_secret_jwt_key_do_not_use_in_production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: backend/${{ matrix.service }}

      - name: TypeScript Compile Check
        run: npm run build
        working-directory: backend/${{ matrix.service }}

      - name: Run Jest Tests
        run: npm run test
        working-directory: backend/${{ matrix.service }}

  # ── RUST NATIVE CRYPTO CORE JOB ──────────────────────────────────────────
  rust-build-and-test:
    name: Rust Crypto Core - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-ios
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/crypto_core/target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('native/crypto_core/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      # Android cross-compilation requires the NDK's Clang cross-linker.
      # Without this, Cargo falls back to the host x86_64 `cc` which rejects
      # aarch64 object files with "Relocations in generic ELF (EM: 183)".
      # $ANDROID_NDK_ROOT is pre-installed on ubuntu-latest runners.
      - name: Configure Android NDK Cross-Linker
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_BIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Verify the NDK is present and report version for debugging
          ls "${NDK_BIN}/aarch64-linux-android21-clang" || \
            (echo "NDK not found at ${ANDROID_NDK_ROOT}" && exit 1)
          # Cargo reads CARGO_TARGET_<TARGET_UPPER>_LINKER to select the linker
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android21-clang" >> $GITHUB_ENV
          # CC / AR are used by -sys crates and build.rs scripts
          echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar" >> $GITHUB_ENV

      - name: Install cargo-audit
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          if ! command -v cargo-audit &>/dev/null; then
            cargo install cargo-audit --locked
          fi

      - name: SCA — cargo audit
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo audit
        working-directory: native/crypto_core
        continue-on-error: true

      - name: SAST — cargo clippy
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: native/crypto_core

      # Host tests run on the native architecture only.
      # Skip them for cross-compile-only targets (Android, iOS) because the
      # compiled binaries cannot execute on the x86_64/aarch64-apple host.
      - name: Run Crate Correctness Tests on Host
        if: matrix.target == 'wasm32-unknown-unknown' || matrix.target == 'aarch64-apple-ios' || matrix.os == 'macos-latest' && matrix.target == 'aarch64-apple-ios'
        run: cargo test
        working-directory: native/crypto_core

      - name: Run Crate Correctness Tests on Host (native linux)
        if: matrix.target == 'aarch64-linux-android'
        run: cargo test --target x86_64-unknown-linux-gnu
        working-directory: native/crypto_core

      - name: Cross-compile Crate for Target
        run: |
          if [ "${{ matrix.target }}" = "wasm32-unknown-unknown" ]; then
            cargo build --release --target ${{ matrix.target }} --features wasm
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        working-directory: native/crypto_core

  # ── SONARQUBE CLOUD SCAN JOB ───────────────────────────────────────────────
  sonarqube-scan:
    name: SonarQube Cloud Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

