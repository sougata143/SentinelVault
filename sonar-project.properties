#Sonarqube config for SonarQube Cloud

sonar.organization=sougata143
sonar.projectKey=sougata143
sonar.projectName=SentinelVault

# Multi-language monorepo — point at each source directory
sonar.sources=core/lib,app/lib,native/crypto_core/src,backend/auth-service/src,backend/security-analysis-service/src,backend/sync-api/src,backend/sharing-service/src

# Exclude generated/build output and tests from the main source scan
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/build/**,**/node_modules/**,**/target/**

# Test file locations (per-service structure)
sonar.tests=core/test,app/test,native/crypto_core/tests,backend/auth-service/test,backend/security-analysis-service/src,backend/sync-api/test,backend/sharing-service/test
sonar.test.inclusions=**/*.spec.ts,**/*_test.dart,native/crypto_core/tests/*.rs