version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinelvault-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelvault}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sentinel_admin} -d $${POSTGRES_DB:-sentinelvault}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - sentinelvault-net

  redis:
    image: redis:7-alpine
    container_name: sentinelvault-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    networks:
      - sentinelvault-net

  auth-service:
    image: sentinelvault-auth:latest
    container_name: sentinelvault-auth
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_password_change_me}@postgres:5432/${POSTGRES_DB:-sentinelvault}
      REDIS_URL: redis://redis:6379
      AUTH_PORT: ${AUTH_PORT:-3001}
    ports:
      - "${AUTH_PORT:-3001}:${AUTH_PORT:-3001}"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.AUTH_PORT||3001)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelvault-net

  sync-api:
    image: sentinelvault-sync:latest
    container_name: sentinelvault-sync
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_password_change_me}@postgres:5432/${POSTGRES_DB:-sentinelvault}
      REDIS_URL: redis://redis:6379
      SYNC_PORT: ${SYNC_PORT:-3002}
    ports:
      - "${SYNC_PORT:-3002}:${SYNC_PORT:-3002}"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.SYNC_PORT||3002)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelvault-net

  security-analysis-service:
    image: sentinelvault-security-analysis:latest
    container_name: sentinelvault-security-analysis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_password_change_me}@postgres:5432/${POSTGRES_DB:-sentinelvault}
      REDIS_URL: redis://redis:6379
      SECURITY_ANALYSIS_PORT: ${SECURITY_ANALYSIS_PORT:-3003}
    ports:
      - "${SECURITY_ANALYSIS_PORT:-3003}:${SECURITY_ANALYSIS_PORT:-3003}"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.SECURITY_ANALYSIS_PORT||3003)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelvault-net

  sharing-service:
    image: sentinelvault-sharing:latest
    container_name: sentinelvault-sharing
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sentinel_admin}:${POSTGRES_PASSWORD:-sentinel_password_change_me}@postgres:5432/${POSTGRES_DB:-sentinelvault}
      REDIS_URL: redis://redis:6379
      SHARING_PORT: ${SHARING_PORT:-3004}
    ports:
      - "${SHARING_PORT:-3004}:${SHARING_PORT:-3004}"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.SHARING_PORT||3004)+'/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinelvault-net

  frontend:
    image: sentinelvault-frontend:latest
    container_name: sentinelvault-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      sync-api:
        condition: service_healthy
      security-analysis-service:
        condition: service_healthy
      sharing-service:
        condition: service_healthy
    networks:
      - sentinelvault-net

networks:
  sentinelvault-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
