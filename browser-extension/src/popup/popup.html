<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 12px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      color: #06b6d4;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 500;
    }
    .status-unlocked {
      background-color: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }
    .status-locked {
      background-color: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .content-area {
      min-height: 100px;
    }
    .lock-message {
      text-align: center;
      padding: 24px 0;
      color: #94a3b8;
    }
    .lock-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .credential-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .credential-item {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cred-info {
      display: flex;
      flex-direction: column;
      max-width: 200px;
    }
    .cred-title {
      font-weight: 600;
      font-size: 14px;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cred-user {
      font-size: 12px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .btn-autofill {
      background-color: #06b6d4;
      color: #0f172a;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-autofill:hover {
      background-color: #22d3ee;
    }
    .no-items {
      text-align: center;
      padding: 24px 0;
      color: #94a3b8;
      font-size: 13px;
    }
    .mapping-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #334155;
    }
    .mapping-title {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .mapping-box {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
    }
    .mapping-field {
      margin-bottom: 8px;
    }
    .mapping-field label {
      display: block;
      color: #94a3b8;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .mapping-field select, .mapping-field input {
      width: 100%;
      background-color: #0f172a;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 6px;
      border-radius: 4px;
      font-size: 12px;
      box-sizing: border-box;
    }
    .btn-save-mapping {
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      width: 100%;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-save-mapping:hover {
      background-color: #60a5fa;
    }
    .btn-clear-mapping {
      background-color: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
      width: 100%;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">SentinelVault</span>
    <span id="status-badge" class="status-badge status-locked">Checking...</span>
  </div>

  <div class="content-area">
    <div id="locked-view" style="display: none;">
      <div class="lock-message">
        <div class="lock-icon">🔒</div>
        <p>Vault is locked or the desktop app is not running.</p>
        <p style="font-size: 11px;">Please open and unlock SentinelVault on your computer.</p>
      </div>
    </div>

    <div id="unlocked-view" style="display: none;">
      <ul id="credential-list" class="credential-list"></ul>

      <div class="mapping-section">
        <div id="toggle-mapping-btn" class="mapping-title">
          <span>⚙ Custom Field Mapping</span>
          <span id="mapping-arrow">▼</span>
        </div>

        <div id="mapping-container" class="mapping-box" style="display: none;">
          <div class="mapping-field">
            <label for="username-selector-input">Username Field Selector:</label>
            <input type="text" id="username-selector-input" placeholder="e.g. #custom_user_id or input[name='user']">
          </div>
          <div class="mapping-field">
            <label for="password-selector-input">Password Field Selector:</label>
            <input type="text" id="password-selector-input" placeholder="e.g. #custom_pass_id or input[name='pass']">
          </div>
          <button id="save-mapping-btn" class="btn-save-mapping">Save Domain Override</button>
          <button id="clear-mapping-btn" class="btn-clear-mapping" style="display: none;">Reset Domain Override</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
