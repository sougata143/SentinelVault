version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelvault-selfhosted-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelvault}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel_admin} -d ${POSTGRES_DB:-sentinelvault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelvault-selfhosted-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: sentinelvault-auth-service
    restart: always
    ports:
      - "${PORT_AUTH:-3001}:3001"
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgres://sentinel_admin:sentinel_password_change_me@postgres:5432/sentinelvault}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_at_least_32_random_bytes!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync-api:
    build:
      context: ../backend/sync-api
      dockerfile: Dockerfile
    container_name: sentinelvault-sync-api
    restart: always
    ports:
      - "${PORT_SYNC:-3002}:3002"
    environment:
      PORT: 3002
      DATABASE_URL: ${DATABASE_URL:-postgres://sentinel_admin:sentinel_password_change_me@postgres:5432/sentinelvault}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_at_least_32_random_bytes!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  security-analysis-service:
    build:
      context: ../backend/security-analysis-service
      dockerfile: Dockerfile
    container_name: sentinelvault-security-service
    restart: always
    ports:
      - "${PORT_SECURITY:-3003}:3003"
    environment:
      PORT: 3003
      DATABASE_URL: ${DATABASE_URL:-postgres://sentinel_admin:sentinel_password_change_me@postgres:5432/sentinelvault}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_at_least_32_random_bytes!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sharing-service:
    build:
      context: ../backend/sharing-service
      dockerfile: Dockerfile
    container_name: sentinelvault-sharing-service
    restart: always
    ports:
      - "${PORT_SHARING:-3004}:3004"
    environment:
      PORT: 3004
      DATABASE_URL: ${DATABASE_URL:-postgres://sentinel_admin:sentinel_password_change_me@postgres:5432/sentinelvault}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_to_at_least_32_random_bytes!}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
